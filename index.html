<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Feed Demo</title>
    <style>
        /* Cài đặt chung */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f; /* Nền tối giống TikTok */
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Tiêu đề trang */
        .header {
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
        }

        /* Lưới chứa các video */
        .video-feed {
            display: grid;
            /* Tự động chia cột, mỗi video rộng tối thiểu 250px */
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Thẻ chứa từng video */
        .video-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 9 / 16; /* Tỷ lệ khung hình dọc chuẩn video ngắn */
            background-color: #000;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        .video-card:hover {
            transform: scale(1.02);
        }

        /* Ảnh thumbnail */
        .video-card img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Cắt ảnh cho vừa khung dọc */
            opacity: 0.85;
            transition: opacity 0.3s;
        }

        .video-card:hover img {
            opacity: 1;
        }

        /* Nút Play giả lập */
        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .video-card:hover .play-icon {
            opacity: 1;
        }

        /* Lớp phủ thông tin (Tiêu đề, lượt xem) */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 15px 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        .video-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 8px 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Giới hạn 2 dòng */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-stats {
            font-size: 12px;
            color: #ccc;
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>

    <div class="header">Video Feed Giải Trí</div>

    <div class="video-feed" id="feedContainer">
        <!-- Các thẻ video sẽ được tạo tự động bằng JavaScript ở đây -->
    </div>

    <script>
        // Danh sách dữ liệu video giả lập (bạn có thể thay đổi)
        const videos = [
            {
                title: "Cô giáo cùng các em nam sinh mới lớn",
                image: "thumbnail.jpg", // Tên file ảnh của bạn
                likes: "545",
                views: "562.5k",
                comments: "177"
            },
            {
                title: "Học sinh trường THPT chuẩn bị vào lớp",
                image: "thumbnail.jpg", // Có thể dùng lại ảnh hoặc thay ảnh khác
                likes: "1.2k",
                views: "1.5M",
                comments: "320"
            },
            {
                title: "Khoảnh khắc đáng yêu của thầy và trò",
                image: "thumbnail.jpg",
                likes: "890",
                views: "300k",
                comments: "45"
            }
        ];

        const feedContainer = document.getElementById('feedContainer');

        // Hàm tạo các thẻ video
        function renderVideos() {
            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                
                // Xử lý sự kiện khi click vào video
                card.onclick = () => {
                    alert(`Đang phát video: "${video.title}"\n\n(Trong ứng dụng thực tế, trình phát video sẽ mở ra ở đây)`);
                };

                card.innerHTML = `
                    <img src="${video.image}" alt="${video.title}">
                    <div class="play-icon">▶</div>
                    <div class="overlay">
                        <h3 class="video-title">${video.title}</h3>
                        <div class="video-stats">
                            <span>❤️ ${video.likes}</span>
                            <span>💬 ${video.comments}</span>
                            <span>👁️ ${video.views}</span>
                        </div>
                    </div>
                `;
                
                feedContainer.appendChild(card);
            });
        }

        // Khởi chạy render
        renderVideos();
    </script>

</body>
</html>
